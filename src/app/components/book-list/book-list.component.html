<div class="card p-4 mb-4 border rounded shadow">
  <h2 class="text-xl font-semibold mb-2">Book List</h2>
  <p class="mb-4 text-gray-600">Book List Component - Ready for implementation</p>
</div>

<div>
  <label for="filter" class="block mb-2 text-sm font-medium text-gray-700">Filter by Status:</label>
  <select
    id="filter"
    class="block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
    [(ngModel)]="statusFilter"
  >
    <option value="all">All</option>
    <option value="read">Read</option>
    <option value="unread">Unread</option>
  </select>
</div>

<table class="min-w-full border border-gray-300">
  <thead>
    <tr class="bg-gray-100">
      <th class="p-2 border">Title</th>
      <th class="p-2 border">Author</th>
      <th class="p-2 border">Status</th>
      <th class="p-2 border">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let book of filteredBooks()">
      <td class="p-2 border">{{ book.title }}</td>
      <td class="p-2 border">{{ book.author }}</td>
      <td
        class="p-2 border font-semibold"
        [ngClass]="{
          'text-green-600': book.status === 'read',
          'text-red-600': book.status === 'unread'
        }"
      >
        {{ book.status | titlecase }}
      </td>
      <td class="p-2 border">
        <button
          class="bg-blue-600 text-white px-3 py-1 rounded"
          (click)="toggleStatus(book.id)"
        >
          Toggle Status
        </button>
      </td>
    </tr>
  </tbody>
</table>
