<div class="book-list-container">
  <h2 class="title">Book List</h2>
  <p class="subtitle">Manage your reading list below</p>

  <div class="filter">
    <label for="filter">Filter by Status:</label>
    <select id="filter" [(ngModel)]="statusFilter">
      <option value="all">All</option>
      <option value="read">Read</option>
      <option value="unread">Unread</option>
    </select>
  </div>

  <table class="book-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of filteredBooks()">
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td [ngClass]="book.status">{{ book.status | titlecase }}</td>
        <td>
          <button (click)="toggleStatus(book.id)">Toggle Status</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
